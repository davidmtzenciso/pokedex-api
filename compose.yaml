# Postgres, Redis and the API, per WF-000 §8. No web service: this repository ships no
# client (ADR-0009).
#
# Ports on the datastores stay published so the application can still be run from an IDE or
# `mvn spring-boot:run` against the same containers.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pokedex
      POSTGRES_USER: pokedex
      # dev-only, and named so nobody mistakes it for a credential. Production supplies
      # POSTGRES_PASSWORD from the environment and never from a tracked file (java:S6437).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedex-dev-only}
    ports:
      - "5432:5432"
    healthcheck:
      # -d and -U both matter: pg_isready reports the *server* is up before the database
      # exists, and Flyway then fails against a database that is not there yet.
      test: ["CMD-SHELL", "pg_isready -U pokedex -d pokedex"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
    depends_on:
      # `condition` matters: a bare depends_on waits for the container to START, not to be
      # USABLE, and Flyway then races an initialising Postgres
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POKEDEX_DB_URL: jdbc:postgresql://postgres:5432/pokedex
      POKEDEX_DB_USER: pokedex
      POKEDEX_DB_PASSWORD: ${POSTGRES_PASSWORD:-pokedex-dev-only}
      POKEDEX_REDIS_HOST: redis
      # replicate the first generation on first boot, so the stack comes up with something
      # to browse. Idempotent: a restart against an existing volume skips it.
      POKEDEX_SEED_UPSTREAM: "true"
      # dev-only, and the keystore it opens is generated fresh inside the container on every
      # start. Production mounts a real keystore and supplies this from a secret store.
      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:-changeit-dev-only}
      JWT_KEYSTORE_PATH: file:/app/keys/pokedex-dev.p12
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          # without a limit MaxRAMPercentage=75 is 75% of the HOST, which on a developer
          # laptop is several gigabytes of heap for a demo
          memory: 1g

volumes:
  pgdata:
  redisdata:
