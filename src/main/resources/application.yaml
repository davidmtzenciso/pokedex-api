server:
  servlet:
    context-path: /api

spring:
  application:
    name: pokedex-api
  # the default in-memory user prints a generated password to stdout at boot, which is a
  # credential in a log line (AC-AUTH-4). Authentication here is the JWT filter, not a
  # UserDetailsService, so the autoconfiguration has nothing to contribute either.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${POKEDEX_REDIS_HOST:localhost}
      port: ${POKEDEX_REDIS_PORT:6379}
      timeout: PT2S
      connect-timeout: PT2S

  datasource:
    url: ${POKEDEX_DB_URL:jdbc:postgresql://postgres:5432/pokedex}
    username: ${POKEDEX_DB_USER:pokedex}
    # no default on purpose — a credential in a tracked file is a credential in the image (java:S6437)
    password: ${POKEDEX_DB_PASSWORD:}

  jpa:
    # Flyway owns the schema; Hibernate only checks that the mapping still matches it
    hibernate:
      ddl-auto: validate
    # a lazy collection initialised by a serialiser is a query outside the transaction boundary
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
  connect-timeout: PT2S
  # a page of N costs 1 + 2N upstream calls, so the read timeout bounds one call, not one page
  read-timeout: PT5S
  max-retries: 3
  retry-backoff: PT0.2S
  # in-flight calls. The page-size cap of 100 bounds how many a request can queue;
  # this bounds how many are in flight. Both axes are needed.
  max-concurrency: ${POKEAPI_MAX_CONCURRENCY:16}
  cache-ttl: ${POKEAPI_CACHE_TTL:PT24H}
  circuit-breaker-threshold: 5
pokedex:
  jwt:
    # a path, not a secret. The password has no default on purpose: a committed fallback is
    # a committed credential (java:S6437), so an unset variable must fail the boot instead
    keystore-path: ${JWT_KEYSTORE_PATH:file:keys/pokedex-dev.p12}
    keystore-password: ${JWT_KEYSTORE_PASSWORD}
    key-alias: ${JWT_KEY_ALIAS:pokedex-dev}
    key-id: ${JWT_KEY_ID:pokedex-dev-1}
    issuer: ${JWT_ISSUER:https://pokedex.elatus-dev.com}
    audience: ${JWT_AUDIENCE:pokedex-api}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  security:
    # an explicit origin allow-list; never '*'
    cors-allowed-origins: ${POKEDEX_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    login-rate-limit: ${POKEDEX_LOGIN_RATE_LIMIT:20}
    login-rate-window: ${POKEDEX_LOGIN_RATE_WINDOW:PT1M}

springdoc:
  # The contract is authored, not derived. Annotation scanning would build a second
  # document that drifts from the file we publish, and AC1c would fail the moment it did.
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    url: /api/v3/api-docs.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
