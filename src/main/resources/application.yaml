server:
  servlet:
    context-path: /api

spring:
  application:
    name: pokedex-api

  datasource:
    url: ${POKEDEX_DB_URL:jdbc:postgresql://postgres:5432/pokedex}
    username: ${POKEDEX_DB_USER:pokedex}
    # no default on purpose — a credential in a tracked file is a credential in the image (java:S6437)
    password: ${POKEDEX_DB_PASSWORD:}

  jpa:
    # Flyway owns the schema; Hibernate only checks that the mapping still matches it
    hibernate:
      ddl-auto: validate
    # a lazy collection initialised by a serialiser is a query outside the transaction boundary
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${POKEDEX_REDIS_HOST:localhost}
      port: ${POKEDEX_REDIS_PORT:6379}
      # bounded on purpose: with Lettuce's default a read against a stopped Redis blocks for
      # minutes, so the cache stalls the request instead of failing open
      timeout: PT2S

pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
  connect-timeout: PT2S
  # a page of N costs 1 + 2N upstream calls, so the read timeout bounds one call, not one page
  read-timeout: PT5S
  max-retries: 3
  retry-backoff: PT0.2S
  # in-flight calls. The page-size cap of 100 bounds how many a request can queue;
  # this bounds how many are in flight. Both axes are needed.
  max-concurrency: ${POKEAPI_MAX_CONCURRENCY:16}
  cache-ttl: ${POKEAPI_CACHE_TTL:PT24H}
  circuit-breaker-threshold: 5

springdoc:
  # The contract is authored, not derived. Annotation scanning would build a second
  # document that drifts from the file we publish, and AC1c would fail the moment it did.
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    url: /api/v3/api-docs.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
